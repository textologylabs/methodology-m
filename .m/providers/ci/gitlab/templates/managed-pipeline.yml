# .gitlab-ci.yml — M-type managed repo pipeline
# Lifecycle phases are delegated to project scripts.
# The pipeline orchestrates; the scripts implement.

image: node:20

# Workflow rules prevent duplicate pipelines (one for branch push,
# one for MR) and ensure all jobs — including those with per-job
# rules — participate correctly in MR pipelines.
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID      # MR pipelines
    - if: $CI_COMMIT_BRANCH == "main" # post-merge on main

stages:
  - install
  - build
  - test
  - snapshot
  - tag
  # `.post` is implicit — `report-failure-to-root` lives there (I-056)

# Default cache: every job pulls node_modules from cache.
# Only the install job pushes (pull-push policy).
cache: &default_cache
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
  policy: pull

# --- Always run ---

install:
  stage: install
  script:
    - npm ci
  cache:
    <<: *default_cache
    policy: pull-push

build:
  stage: build
  script:
    - npm run build --if-present
  needs: [install]

test:
  stage: test
  script:
    - npm test
  needs: [build]

# --- MR pipelines only: publish snapshot artefact ---

snapshot:
  stage: snapshot
  script:
    - npm run snapshot --if-present
  rules:
    - if: $CI_MERGE_REQUEST_IID
  needs: [test]

# --- Merge to main only: auto-tag (I-004) ---
# After a story MR merges to main, computes the next semver tag and
# pushes it. Default bump is `patch`. Honours escape hatches in the
# merge commit message:
#   [skip-auto-tag]    — skip entirely (refactor / revert merges)
#   [bump-minor]       — minor bump instead of patch
#   [bump-major]       — major bump instead of patch
# Skips silently if the merge commit's tree is unchanged from the
# previously-tagged commit (no functional change).
#
# Auth: M_PROJECT_TAG_TOKEN — a project access token with
# write_repository scope, provisioned by wire-orchestration.

tag:
  stage: tag
  image: alpine:3.19
  before_script:
    - apk add --no-cache git curl
    - git config --global user.email "m-auto-tag@methodology-m"
    - git config --global user.name "M auto-tag"
  script:
    - |
      MSG=$(git log -1 --pretty=%B)
      case "$MSG" in
        *"[skip-auto-tag]"*|*"[no-tag]"*)
          echo "Skipping auto-tag (escape hatch in commit message)"
          exit 0
          ;;
      esac
      LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\1/')
      MINOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\2/')
      PATCH=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+).*/\3/')
      case "$MSG" in
        *"[bump-major]"*) NEW="v$((MAJOR+1)).0.0" ;;
        *"[bump-minor]"*) NEW="v$MAJOR.$((MINOR+1)).0" ;;
        *)               NEW="v$MAJOR.$MINOR.$((PATCH+1))" ;;
      esac
      if [ "$LATEST" != "v0.0.0" ]; then
        if git diff --quiet "$LATEST" HEAD; then
          echo "Skipping auto-tag (tree unchanged since $LATEST)"
          exit 0
        fi
      fi
      echo "Tagging $NEW (was $LATEST)"
      git tag -a "$NEW" -m "$MSG"
      AUTH_URL=$(echo "$CI_REPOSITORY_URL" | sed -E "s|https://[^@]+@|https://oauth2:$M_PROJECT_TAG_TOKEN@|")
      git push "$AUTH_URL" "$NEW"
      echo "M_AUTO_TAG_NEW=$NEW" >> tag.env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [test]
  artifacts:
    reports:
      dotenv: tag.env

# --- Tag → root notification (I-004) ---
# Runs only when `tag` produced a new tag (the dotenv is empty
# otherwise). Mirrors report-failure-to-root in shape but classifies
# the trigger as EVENT_KIND=tag so root's detect-story-trigger.sh
# routes it to shadow:bump-topology (I-004).

report-tag-to-root:
  stage: .post
  image: alpine:3.19
  needs: [tag]
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "${M_AUTO_TAG_NEW:-}" ]; then
        echo "No new tag in this run — nothing to notify"
        exit 0
      fi
      if [ -z "${M_TRIGGER_TOKEN:-}" ] || [ -z "${ROOT_PROJECT_ID:-}" ]; then
        echo "M_TRIGGER_TOKEN or ROOT_PROJECT_ID not set — skipping notify"
        exit 0
      fi
      ENCODED_PATH=$(printf '%s' "$CI_PROJECT_PATH" | sed 's|/|%2F|g')
      URL="$CI_API_V4_URL/projects/$ROOT_PROJECT_ID/ref/main/trigger/pipeline?token=$M_TRIGGER_TOKEN&variables[SOURCE_PROJECT_ID]=$CI_PROJECT_ID&variables[SOURCE_PROJECT_PATH]=$ENCODED_PATH&variables[NEW_TAG]=$M_AUTO_TAG_NEW&variables[EVENT_KIND]=tag"
      echo "Notifying root of new tag $M_AUTO_TAG_NEW"
      # -g (globoff) per I-057.
      curl -fsSL -g -X POST -o /dev/null "$URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

# --- Pipeline-failure fan-out trigger (I-056) ---
# Runs on any pipeline failure. Calls the root repo's trigger
# endpoint directly with EVENT_KIND=pipeline so root's
# shadow:detect-trigger can route the event into the
# pipeline-failure fan-out path (I-032). Replaces the
# pipeline-events webhook from v0.8.0, which GitLab.com rejects
# at the trigger endpoint with 403 (Pipeline Hook header is
# loop-prevention-blocked). Running under CI job context
# means no Pipeline Hook header — request goes through.

report-failure-to-root:
  stage: .post
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "${M_TRIGGER_TOKEN:-}" ] || [ -z "${ROOT_PROJECT_ID:-}" ]; then
        echo "M_TRIGGER_TOKEN or ROOT_PROJECT_ID not set — skipping fan-out"
        exit 0
      fi
      ENCODED_PATH=$(printf '%s' "$CI_PROJECT_PATH" | sed 's|/|%2F|g')
      URL="$CI_API_V4_URL/projects/$ROOT_PROJECT_ID/ref/main/trigger/pipeline?token=$M_TRIGGER_TOKEN&variables[SOURCE_PROJECT_ID]=$CI_PROJECT_ID&variables[SOURCE_PROJECT_PATH]=$ENCODED_PATH&variables[SOURCE_PIPELINE_ID]=$CI_PIPELINE_ID&variables[EVENT_KIND]=pipeline"
      echo "Notifying root of pipeline failure"
      # -g (globoff) is required: GitLab's trigger endpoint takes
      # variables in `variables[KEY]=VAL` form, and curl otherwise
      # interprets `[` and `]` as numeric-range glob syntax (I-057).
      curl -fsSL -g -X POST -o /dev/null "$URL"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_failure
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
